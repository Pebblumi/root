name: Root

on:
  workflow_dispatch:  
  
jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate script with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRENDING_TOPIC: ${{ vars.TRENDING_TOPIC }}
        run: python generate_script.py

      - name: Generate images with Pollinations + host on Catbox
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python generate_images.py

      - name: Render 60-second video with JSON2Video
        env:
          JSON2VIDEO_API_KEY: ${{ secrets.JSON2VIDEO_API_KEY }}
        run: python json2video_render.py

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python upload_youtube.py
